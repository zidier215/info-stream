name = "info-stream"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# 三个域名绑定后，https://<name>.pages.dev 会 301 到自定义域。
# canonical 由 functions/index.js 按 Host 动态注入，三站各自独立。

# ---------- 接口保护（v2.2）----------
# 所有值都是可选的，不配也能跑；生产建议至少配 API_SECRET。
#
# API_SECRET        自定义密钥。配了之后 /api/discover 与 /api/translate 才开放（默认关闭 = 403）。
#                   自己访问时在地址栏带 ?key=你的密钥 即可，密钥记在 localStorage。
# FEED_LIMIT        /api/feed 每 IP 每分钟的请求数上限，默认 30。
# FEED_REQUIRE_KEY  设为 "1" 则 /api/feed 也要密钥。默认 "0"——首页要靠它出数据，
#                   彻底关掉页面就空了，所以默认只做限流 + 同源校验。
# RATE_LIMIT        私有接口每 IP 每分钟上限，默认 10。
# ALLOW_NO_ORIGIN   设为 "1" 允许不带 Origin 头的请求（curl / 脚本调试）。默认 "0"。
#
# 密钥请在 Cloudflare 控制台配置（Settings → Environment variables），不要写进本文件。

# ---------- Cloudflare D1 边缘数据库绑定（AI 论文档案与持久化存储）----------
# 控制台配置路径（推荐直接界面绑定，无需在配置文件写死 UUID）：
# Cloudflare 控制台 -> Workers & Pages -> info-stream -> Settings -> Functions -> D1 database bindings
# 绑定变量名 (Variable name)：DB
# 数据库 (Database)：infostream-db
#
# 若需通过 wrangler.toml 显式声明，请将下方 database_id 替换为您在控制台创建后的真实 UUID：
# [[d1_databases]]
# binding = "DB"
# database_name = "infostream-db"
# database_id = "<your-real-d1-uuid>"