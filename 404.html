<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 页面未找到 · Page Not Found · InfoStream</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <!-- Google Analytics 4 (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JBQYPMLVHR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JBQYPMLVHR');
  </script>
  <style>
    .error-container {
      max-width: 680px;
      margin: 80px auto;
      padding: 40px 24px;
      text-align: center;
      background: var(--card, #ffffff);
      border: 1px solid var(--line, #e2e8f0);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .error-code {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 16px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text, #0f172a);
      margin: 0 0 12px;
    }
    .error-desc {
      font-size: 15px;
      color: var(--muted, #64748b);
      line-height: 1.6;
      margin: 0 auto 32px;
      max-width: 480px;
    }
    .error-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .error-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 12px;
      border-radius: 12px;
      background: var(--bg2, #f8fafc);
      border: 1px solid var(--line, #e2e8f0);
      color: var(--text, #0f172a);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .error-link span.sub {
      font-size: 11px;
      color: var(--muted, #64748b);
      font-weight: normal;
      margin-top: 4px;
    }
    .error-link:hover {
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
      color: #2563eb;
    }
    .error-btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2563eb;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .error-btn-home:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">抱歉，您访问的信息页面不存在</h1>
    <p class="error-desc">
      该页面可能已被移动、删除，或输入的链接有误。您可以直接返回主站，或探索以下垂类子站点。
    </p>
    
    <div>
      <a href="https://myinfostream.com/" class="error-btn-home">
        🌊 返回信息河主站
      </a>
    </div>

    <div class="error-nav">
      <a href="https://ai.myinfostream.com/" class="error-link">
        <span>🤖 AI 情报站</span>
        <span class="sub">大模型与芯片前沿</span>
      </a>
      <a href="https://news.myinfostream.com/" class="error-link">
        <span>🌍 国际新闻站</span>
        <span class="sub">五语种严肃媒体</span>
      </a>
      <a href="https://game.myinfostream.com/" class="error-link">
        <span>🎮 游戏福利站</span>
        <span class="sub">Epic 限时免费领取</span>
      </a>
      <a href="https://hot.myinfostream.com/" class="error-link">
        <span>🔥 实时热搜榜</span>
        <span class="sub">微博/百度/抖音实时榜</span>
      </a>
    </div>
  </div>
</body>
</html>
